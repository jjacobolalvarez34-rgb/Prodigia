<title>Prodigia, catorce pieles</title>
<meta name="description" content="Las mismas pantallas de Prodigia con catorce estéticas visuales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=Geist+Mono:wght@500;700&family=Pixelify+Sans:wght@400..700&family=Lilita+One&family=Nunito:wght@600;800;900&family=Jersey+10&family=VT323&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DotGothic16&family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cinzel:wght@600;800;900&family=Alegreya+Sans:wght@400;500;700&family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@400;600&family=Syncopate:wght@700&family=Share+Tech+Mono&family=Josefin+Sans:wght@300;400;600;700&family=Quicksand:wght@400;500;700&family=Press+Start+2P&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Alegreya+SC:wght@500;700&family=Alegreya:wght@400;500;700&display=swap">
<style>
/* Maqueta compartida: la estructura de las pantallas de la app de hoy. Cada estética
   (skins/*.css) solo cambia tokens y decoración; nunca el contenido ni el orden. */
:root{
  --pagina-bg:#06080f; --pagina-texto:#EEF0F7; --pagina-tenue:#8892B0; --pagina-borde:#232B47; --pagina-acento:#7C5CFF;
  --bg:#090C14; --sup1:#12172A; --sup2:#171D34; --sup3:#1E2542; --borde:#232B47;
  --texto:#F4F6FB; --texto2:#8892B0;
  --primario:#7C5CFF; --primario-base:#6C4CF1; --primario-claro:#B9A8FF;
  --logro:#FFB627; --logro-labio:#B87800; --correcto:#3DDC97; --error:#FF5D5D; --racha:#FF8A3D;
  --f-display:system-ui, sans-serif; --f-texto:system-ui, sans-serif; --f-num:ui-monospace, monospace;
  --radio:16px; --radio-chico:12px; --radio-boton:16px; --radio-pildora:999px; --radio-seg:14px;
  --borde-w:1px; --labio:4px; --trazo:2;
  --barra-fondo:#1E2542; --barra-alto:8px;
  --edif:#141a2e; --edif2:#1b2238; --cielo-ciudad:#0b0f1d; --ventana-off:#232a44; --luna:#E9E4FF;
  --tab-bg:#090C14; --carcasa:#05070d;
  --placa-bg:#141030; --placa-borde:#E8B34D;
  --h1:28px; --h1-peso:700;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--pagina-bg);color:var(--pagina-texto);font-family:var(--f-texto);padding-inline:16px;padding-block:24px 64px;transition:background .3s}
p{margin:0}
a{color:inherit;text-decoration:none}

/* ---------- galería ---------- */
.galeria-cab{max-width:1240px;margin:0 auto 22px;display:grid;gap:14px}
.galeria-cab h1{margin:0;font:700 clamp(30px,4vw,44px)/1 var(--f-display);text-wrap:balance;text-transform:var(--mayus,none);letter-spacing:var(--h1-track,0)}
.selector{display:flex;flex-wrap:wrap;gap:6px}
.selector button{font:600 13px/1 var(--f-texto);padding:9px 12px;border-radius:999px;border:1px solid var(--pagina-borde);background:transparent;color:var(--pagina-texto);cursor:pointer}
.selector button[aria-pressed="true"]{background:var(--pagina-acento);border-color:var(--pagina-acento);color:var(--pagina-sobre-acento,#fff)}
.selector button:focus-visible{outline:2px solid var(--pagina-acento);outline-offset:2px}
.ficha{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start;border-top:1px solid var(--pagina-borde);padding-top:14px}
.ficha h2{margin:0 0 6px;font:700 24px/1.1 var(--f-display);text-transform:var(--mayus,none)}
.ficha p{line-height:1.55;max-width:70ch;color:var(--pagina-texto);opacity:.92}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.ficha dt{color:var(--pagina-tenue)}
.ficha dd{margin:0}
@media (max-width:760px){.ficha{grid-template-columns:1fr}}
.maquetas{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px 26px;justify-content:center}
.maqueta{margin:0;display:grid;gap:10px;justify-items:center}
.maqueta figcaption{font:600 12px var(--f-num);letter-spacing:2px;text-transform:uppercase;color:var(--pagina-tenue)}

/* ---------- teléfono ---------- */
.tel{width:340px;height:720px;border-radius:38px;border:6px solid var(--carcasa);overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--texto);font-family:var(--f-texto);font-size:14px;position:relative;isolation:isolate}
.estado{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 2px;font:600 11px var(--f-num);color:var(--texto2);position:relative;z-index:2}
.estado-d{display:flex;gap:3px}
.estado-d i{width:4px;height:4px;border-radius:50%;background:currentColor}
.hud{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;position:relative;z-index:2}
.hueco{flex:1}
.avatar{width:36px;height:36px;border-radius:var(--radio-avatar,50%);display:grid;place-items:center;flex:none;background:var(--av,#2b2350);border:2px solid var(--avatar-borde,#E8B34D);color:#fff;font:700 15px var(--f-display);position:relative}
.a2{--av:#2563EB}.a3{--av:#C026D3}.a4{--av:#0E9F6E}.a5{--av:#B8860B}
.pildora{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 8px;border-radius:var(--radio-pildora);background:var(--sup1);border:var(--borde-w) solid var(--borde);font-size:13px;white-space:nowrap}
.pildora .ico{width:16px;height:16px}
.redondo{width:36px;height:36px;border-radius:var(--radio-pildora);display:grid;place-items:center;flex:none;background:var(--sup1);border:var(--borde-w) solid var(--borde);color:var(--texto2);position:relative}
.redondo .ico{width:18px;height:18px}
.punto{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--error);border:2px solid var(--sup1)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:var(--trazo);stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico use[href="#i-chispa"]{fill:var(--logro);stroke:none}
.ico use[href="#i-llama"]{fill:var(--racha);stroke:none}
.ico.mini{width:13px;height:13px;vertical-align:-2px}
.ico.grande{width:34px;height:34px}

.pantalla > *,.pie > *{flex-shrink:0}
.pantalla{flex:1;min-height:0;overflow:hidden;padding:4px 14px 14px;display:flex;flex-direction:column;gap:var(--gap,12px);position:relative;z-index:1}
.t-h1{margin:0;font:var(--h1-peso) var(--h1)/1.05 var(--f-display);text-transform:var(--mayus,none);letter-spacing:var(--h1-track,0)}
.t-h2{font:700 20px/1.1 var(--f-display);text-transform:var(--mayus,none)}
.t-h3{font:var(--h3-peso,700) 16px/1.2 var(--f-display);text-transform:var(--h3-mayus,none);letter-spacing:var(--h3-track,0)}
.t-micro{font:700 10.5px/1.3 var(--f-texto);letter-spacing:1.2px;text-transform:uppercase}
.t-nota{font-size:12.5px;line-height:1.35;color:var(--texto2)}
.t-mono{font:700 13px var(--f-num)}
.t-fuerte{font-weight:700;font-size:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.c-mundo{color:var(--mundo)}.c-logro{color:var(--logro)}.c-primario{color:var(--primario-claro)}.c-racha{color:var(--racha)}.c-correcto{color:var(--correcto)}.c-error{color:var(--error)}.t-blanco{color:var(--texto)}
.centro{text-align:center}.centro-x{justify-content:center}
.mt{margin-top:8px}.flex1{flex:1;min-width:0}.pequena{font-size:11px}.grande{font-size:18px}
.entre{display:flex;justify-content:space-between;align-items:center;gap:8px}
.al-base{align-items:flex-end;flex-wrap:wrap}
.fila{display:flex;align-items:center;gap:12px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.tarjeta{background:var(--tarjeta-bg,var(--sup1));border:var(--borde-w) solid var(--borde);border-radius:var(--radio);padding:14px;box-shadow:var(--sombra-tarjeta,none);position:relative}
.tarjeta[style*="--acc"],.tarjeta.continuar,.tarjeta.mundo:not(.bloqueado){border-color:color-mix(in srgb,var(--acc,var(--mundo)) 55%,var(--borde))}
.tarjeta-in{padding:14px;display:grid;gap:10px}
.continuar{padding:0;overflow:hidden}
.chico{display:grid;gap:3px;padding:12px}
.insignia{min-width:20px;height:20px;border-radius:10px;background:var(--logro);color:#2A1A00;font-size:11px;display:inline-grid;place-items:center;padding:0 6px}
.reto{display:grid;gap:2px}

.barra{height:var(--barra-alto);border-radius:var(--radio-barra,999px);background:var(--barra-fondo);overflow:hidden}
.barra i{display:block;height:100%;background:var(--barra-relleno,var(--mundo-base,var(--primario)));border-radius:inherit}
.barra.fina{height:6px;margin-top:5px}

.boton{display:flex;align-items:center;justify-content:center;gap:8px;height:var(--boton-alto,50px);border-radius:var(--radio-boton);font:var(--boton-peso,700) var(--boton-tam,16px) var(--f-boton,var(--f-display));text-transform:var(--boton-mayus,none);letter-spacing:var(--boton-track,0);color:var(--b-texto,#fff);background:var(--b-color);box-shadow:0 var(--labio) 0 var(--b-labio);margin-bottom:var(--labio);position:relative}
.boton .ico{width:20px;height:20px}
.b-mundo{--b-color:var(--mundo-base);--b-labio:color-mix(in srgb,var(--mundo-base) 55%,#000)}
.b-primario{--b-color:var(--primario-base);--b-labio:color-mix(in srgb,var(--primario-base) 55%,#000)}
.b-logro{--b-color:var(--logro);--b-labio:var(--logro-labio);--b-texto:#2A1A00}
.b-sec{--b-color:var(--sup2);--b-labio:var(--borde);--b-texto:var(--texto)}
.b-sm{--boton-alto:40px;--boton-tam:13.5px;white-space:nowrap}

.anillo{position:relative;width:66px;height:66px;display:grid;place-items:center;flex:none}
.anillo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:var(--anillo-g,7)}
.anillo-fondo{stroke:var(--barra-fondo)}
.anillo-valor{stroke:var(--anillo-c,var(--logro));stroke-dasharray:var(--valor) 100;stroke-linecap:var(--anillo-cap,round)}
.anillo b{position:relative;font-size:13px}
.anillo.grande{width:100px;height:100px}
.anillo.grande b{font-size:20px}
.sello-evento{width:44px;height:44px;border-radius:var(--radio-chico);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--logro) 18%,transparent);color:var(--logro);font:800 16px var(--f-display)}

/* mundos */
.alineacion{padding:8px 12px;border-radius:var(--radio-chico);background:var(--sup1);border:var(--borde-w) solid var(--borde)}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden}
.chip{padding:7px 13px;border-radius:var(--radio-pildora);border:var(--borde-w) solid var(--borde);background:var(--sup1);font-size:12.5px;font-weight:600;color:var(--texto2);white-space:nowrap}
.chip.on{background:var(--sup3);color:var(--texto);border-color:color-mix(in srgb,var(--primario) 50%,var(--borde))}
.chips.ciudades .chip[style*="--mundo"]{color:var(--mundo)}
.mundo{padding:10px}
.nombre-mundo{letter-spacing:var(--nombre-track,1px)}
.ciudad{display:block;width:100%;border-radius:var(--radio-ciudad,calc(var(--radio) - 6px))}
.ciudad-caja{position:relative}
.doble-exp{position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:var(--radio-pildora);background:var(--logro);color:#2A1A00;font:800 11px var(--f-display)}
.bloqueado .ciudad{filter:grayscale(.8) brightness(.6)}
.bloqueado .ico{color:var(--texto2)}
.precio{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--radio-pildora);background:var(--sup2);border:var(--borde-w) solid var(--borde);font-size:13px;white-space:nowrap}
.precio .ico{width:15px;height:15px}

/* partida */
.cabecera-sprint{display:flex;justify-content:space-between;align-items:center;padding:8px 16px}
.reloj{width:58px;height:58px;--anillo-g:5;--anillo-c:var(--mundo)}
.reloj b{font-size:18px}
.combo{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--radio-pildora);background:color-mix(in srgb,var(--racha) 16%,transparent);color:var(--racha);font:800 20px var(--f-display)}
.combo .ico{width:22px;height:22px}
.progreso-sprint{display:flex;justify-content:space-between;align-items:center;padding:0 18px 8px}
.puntos{display:flex;gap:6px}
.puntos i{width:9px;height:9px;border-radius:var(--radio-punto,50%);background:var(--sup3)}
.puntos .ok{background:var(--correcto)}.puntos .mal{background:var(--error)}.puntos .actual{background:var(--mundo);transform:scale(1.35)}
.escudos{color:var(--primario-claro)}.escudos .ico{width:16px;height:16px}
.problema{display:grid;gap:8px;padding:26px 14px;text-align:center;border-color:color-mix(in srgb,var(--mundo) 55%,var(--borde))}
.enunciado{font:700 46px/1 var(--f-num-grande,var(--f-num))}
.respuesta{font:700 30px/1 var(--f-num);color:var(--mundo);min-height:32px}
.cursor{display:inline-block;width:3px;height:26px;background:var(--mundo);vertical-align:-3px;margin-left:3px;animation:cursor 1s steps(1) infinite}
@keyframes cursor{50%{opacity:0}}
.ayudas{display:flex;gap:8px;justify-content:center}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.teclado a{height:52px;border-radius:var(--radio-tecla,var(--radio-chico));background:var(--sup2);border:var(--borde-w) solid var(--borde);display:grid;place-items:center;font:700 22px var(--f-num);box-shadow:0 3px 0 var(--tecla-labio,var(--borde))}
.teclado .t-ok{background:var(--correcto);color:#05301c;border-color:transparent;box-shadow:0 3px 0 #1d8a5c}
.teclado .t-borrar{color:var(--texto2)}
.teclado .ico{width:24px;height:24px}

/* resultado */
.resultado .pantalla{gap:14px}
.exp{font:800 34px/1 var(--f-num);color:var(--logro)}
.medalla{width:44px;height:44px;border-radius:50%;background:var(--logro);color:#3A2600;display:grid;place-items:center;flex:none}
.pie{padding:10px 16px 18px;display:grid;gap:8px;position:relative;z-index:1}

/* competir */
.segmentos{display:flex;background:var(--sup1);border:var(--borde-w) solid var(--borde);border-radius:var(--radio-seg);padding:3px;gap:3px}
.segmentos span{flex:1;text-align:center;padding:8px 0;border-radius:calc(var(--radio-seg) - 3px);font-size:13px;font-weight:600;color:var(--texto2)}
.segmentos .on{background:var(--sup3);color:var(--texto)}
.rango{display:grid;justify-items:center;gap:3px;padding:16px 14px}
.insignia-rango{position:relative;width:54px;height:60px;display:grid;place-items:center}
.insignia-rango svg{position:absolute;inset:0;width:100%;height:100%}
.insignia-rango path{fill:var(--acc)}
.insignia-rango .int{fill:rgba(0,0,0,.22)}
.insignia-rango b{position:relative;font:800 15px var(--f-display);color:#2A1A00}
.rango-barra{width:100%;margin-top:8px}
.rango-barra i{background:linear-gradient(90deg,var(--acc),#fff)}
.stat{display:grid;justify-items:center;gap:2px;padding:10px 4px}
.stat b{font-size:18px}
.titulo-seccion{margin:6px 0 -2px;font:700 var(--ts-tam,15px) var(--f-display);color:var(--texto);text-transform:var(--ts-mayus,none);letter-spacing:var(--ts-track,0)}
.lista{padding:2px 12px}
.fila-lista{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde)}
.fila-lista:last-child{border-bottom:0}
.fila-lista > :nth-child(2):not(.flex1){flex:1;min-width:0}
.res{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 12px var(--f-display);flex:none}
.gano{background:color-mix(in srgb,var(--correcto) 20%,transparent);color:var(--correcto)}
.perdio{background:color-mix(in srgb,var(--error) 20%,transparent);color:var(--error)}

/* social */
.en-linea{display:flex;gap:18px}
.amigo{display:grid;justify-items:center;gap:4px}
.amigo .avatar{width:50px;height:50px;font-size:19px}
.amigo .avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--correcto);border:2px solid var(--bg)}
.conv .t-nota{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* perfil */
.placa{position:relative;border-radius:var(--radio-placa,22px);overflow:hidden;border:2px solid var(--placa-borde);background:var(--placa-bg);flex:none}
.placa-ciudad{position:absolute;inset:0 0 auto 0;height:96px}
.placa-ciudad .ciudad{border-radius:0;height:96px}
.placa-in{position:relative;padding:54px 14px 14px;display:grid;gap:7px}
.avatar.grande{width:76px;height:76px;font-size:30px;border-width:3px;border-color:var(--placa-borde)}
.placa-nombre{font:800 28px/1 var(--f-display);text-transform:var(--mayus,none)}
.chip-titulo{justify-self:start;padding:4px 10px;border-radius:var(--radio-pildora);background:rgba(255,255,255,.12);font-size:11px;font-weight:700}
.fila-datos{display:flex;gap:12px;align-items:center;font-size:12px}
.c-oro-rango{color:#E8B34D;font-weight:700}
.vidrio{padding:10px 12px;border-radius:var(--radio-chico);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.barra.blanca{--barra-relleno:#fff;--barra-fondo:rgba(255,255,255,.15);height:6px;margin:7px 0}
.glifo{width:36px;height:36px;border-radius:var(--radio-chico);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--mundo-base) 25%,transparent);color:var(--mundo);font:700 16px var(--f-num)}
.favorita .barra i{background:var(--mundo-base)}
.item-ico{width:34px;height:34px;border-radius:var(--radio-chico);background:var(--sup2);display:grid;place-items:center;flex:none}
.item-ico .ico{width:18px;height:18px}
.menu .fila-lista{padding:9px 0}

/* recompensas y tienda */
.cabecera-apilada{display:flex;align-items:center;gap:12px;padding:8px 14px 10px;position:relative;z-index:2}
.celda{background:var(--tarjeta-bg,var(--sup1));border:var(--borde-w) solid var(--borde);border-radius:var(--radio);padding:8px 8px 10px;display:grid;gap:2px}
.cielo{display:block;width:100%;height:auto;border-radius:calc(var(--radio) - 6px);background:var(--cielo-noche,#070a14);margin-bottom:4px}
.trazo{fill:none;stroke:var(--mundo);stroke-width:1.3}
.trazo.falta{stroke:var(--texto2);opacity:.4;stroke-dasharray:3 3}
.est-on circle{fill:var(--estrella,var(--logro))}
.est-off circle{fill:none;stroke:var(--texto2);opacity:.6}
.capsula-fila{display:flex;align-items:center;gap:12px;padding:12px}
.capsula{width:46px;height:40px;border-radius:22px 22px 12px 12px;background:linear-gradient(180deg,#c9bbff,#7C5CFF);position:relative;flex:none}
.capsula i{position:absolute;left:0;right:0;top:16px;height:5px;background:rgba(0,0,0,.3)}
.calendario{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dia{display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:var(--radio-dia,10px);border:var(--borde-w) solid var(--borde);background:var(--sup2)}
.dia b{font-weight:700;font-size:8.5px;color:var(--texto2);white-space:nowrap}
.dia i{font-style:normal;font-size:9.5px}
.dia .ico{width:16px;height:16px}
.dia.hecho{opacity:.5}.dia.hecho .ico{color:var(--correcto)}
.dia.hoy{border-color:var(--logro);background:color-mix(in srgb,var(--logro) 14%,var(--sup2))}
.dia .ico use[href="#i-copo"]{stroke:#7FD8FF}
.dia .ico use[href="#i-regalo"]{stroke:var(--logro)}
.mision{display:flex;gap:12px;align-items:center}
.premio-mision{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radio-pildora);border:var(--borde-w) solid var(--borde);color:var(--logro);font-size:13px}
.premio-mision .ico{width:14px;height:14px}
.destacado{padding:0;overflow:hidden;display:grid;grid-template-columns:104px 1fr}
.destacado-arte{position:relative;min-height:100%}
.destacado-arte .ciudad{position:absolute;inset:0;height:100%;border-radius:0}
.destacado .tarjeta-in{padding:12px;gap:3px}
.articulo{display:grid;gap:3px;padding:10px;justify-items:start}
.muestra{width:100%;height:62px;border-radius:var(--radio-chico);background:var(--sup2);display:grid;place-items:center;margin-bottom:4px;overflow:hidden}
.marco-aurora::after{content:"";width:44px;height:44px;border-radius:50%;border:5px solid transparent;background:linear-gradient(var(--sup2),var(--sup2)) padding-box,conic-gradient(#3DDC97,#7C5CFF,#FF8A3D,#3DDC97) border-box}
.fondo-nebulosa{background:radial-gradient(circle at 30% 35%,#C026D3 0,transparent 55%),radial-gradient(circle at 75% 70%,#2563EB 0,transparent 50%),#140b2a}
.estela-marea i{width:70%;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,#2DD4BF)}
.emote-gg{font:900 26px var(--f-display);color:var(--logro)}
.rareza{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.epico{color:#C084FC}.raro{color:#60A5FA}.comun{color:var(--texto2)}

/* barra de pestañas */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 16px;background:var(--tab-bg);border-top:var(--borde-w) solid var(--borde);position:relative;z-index:2}
.tabbar a{display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--texto2)}
.tabbar .ico{width:22px;height:22px}
.tabbar .on{color:var(--tab-on,var(--primario-claro))}

/* ciudad (skyline generado) */
.ciudad .c-cielo{fill:var(--cielo-ciudad)}
.ciudad .c-luna{fill:var(--luna)}
.ciudad .ed{fill:var(--edif)}
.ciudad .ed2{fill:var(--edif2)}
.ciudad .v{fill:var(--mundo,#9B85FF)}
.ciudad .vo{fill:var(--ventana-off)}
.ciudad.apagada .v{fill:var(--ventana-off)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Hoy: la app tal como está (referencia) ===== */
[data-skin="actual"]{
  --f-display:"Space Grotesk", system-ui, sans-serif;

  .tarjeta[style*="--acc"],.tarjeta.continuar,.tarjeta.mundo:not(.bloqueado),.problema{box-shadow:0 0 26px color-mix(in srgb,var(--acc,var(--mundo)) 30%,transparent)}
  .recompensas-chico{border-color:var(--logro);box-shadow:0 0 14px color-mix(in srgb,var(--logro) 35%,transparent)}

}

/* ===== Prodigia con identidad: la de hoy, pulida =====
   Idea: la noche. Cielo con estrellas, ciudades protagonistas, barras que se llenan
   como pisos de ventanas, luz solo donde hay ventanas o mundo activo. */
[data-skin="propia"]{
  --pagina-bg:#05070e; --pagina-borde:rgba(148,160,214,.16); --pagina-acento:#7C5CFF;
  --bg:#080B15; --sup1:#10152a; --sup2:#161c35; --sup3:#202848; --borde:rgba(148,160,214,.13);
  --texto:#F2F4FB; --texto2:#8E97B8;
  --f-display:"Bricolage Grotesque", "Segoe UI", sans-serif;
  --f-texto:"Onest", "Segoe UI", sans-serif;
  --f-num:"Geist Mono", ui-monospace, monospace;
  --radio:20px; --radio-chico:13px; --radio-boton:16px; --radio-seg:15px;
  --h1:30px; --h1-peso:800; --h1-track:-.6px;
  --barra-fondo:#1a2140; --barra-alto:9px; --radio-barra:3px;
  --edif:#0f1428; --edif2:#141a33; --ventana-off:#1c2342; --luna:#F3EEDB;
  --tab-bg:transparent; --carcasa:#03040a;

  .tel{background:
      radial-gradient(1.2px 1.2px at 12% 6%,#fff9 50%,transparent 52%),
      radial-gradient(1px 1px at 34% 3%,#fff7 50%,transparent 52%),
      radial-gradient(1.3px 1.3px at 58% 9%,#fffa 50%,transparent 52%),
      radial-gradient(1px 1px at 81% 4%,#fff6 50%,transparent 52%),
      radial-gradient(1px 1px at 92% 14%,#fff8 50%,transparent 52%),
      radial-gradient(1px 1px at 6% 18%,#fff5 50%,transparent 52%),
      radial-gradient(120% 40% at 50% 0,#141a3a 0,transparent 70%),
      var(--bg)}
  .tarjeta,.celda{background:linear-gradient(180deg,#131a32 0,#0f1428 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 24px -16px rgba(0,0,0,.9)}
  .tarjeta[style*="--acc"]{border-color:color-mix(in srgb,var(--acc) 38%,var(--borde))}
  .t-h1{font-variation-settings:"opsz" 72}
  .t-h2,.t-h3,.placa-nombre{font-variation-settings:"opsz" 48;letter-spacing:-.2px}
  .t-micro{font-weight:600;letter-spacing:1.5px}
  .titulo-seccion{display:flex;align-items:center;gap:10px;font:600 11px var(--f-texto);letter-spacing:1.6px;text-transform:uppercase;color:var(--texto2);margin:8px 0 -2px}
  .titulo-seccion::after{content:"";flex:1;height:1px;background:var(--borde)}

  /* HUD: el ícono vive en su círculo de color */
  .pildora{background:rgba(16,21,42,.85);padding:3px 11px 3px 3px;gap:6px}
  .pildora .ico{width:24px;height:24px;padding:4px;border-radius:50%}
  .racha .ico{background:color-mix(in srgb,var(--racha) 20%,transparent)}
  .chispas .ico{background:color-mix(in srgb,var(--logro) 18%,transparent)}
  .avatar{border-width:2px;box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(232,179,77,.35)}
  .hud .avatar{background:linear-gradient(160deg,#3b2f80,#211a4d)}

  /* barras: pisos de ventanas que se encienden */
  .barra{position:relative}
  .barra i{background:linear-gradient(90deg,var(--mundo-base,var(--primario-base)),var(--mundo,var(--primario-claro)));box-shadow:0 0 10px color-mix(in srgb,var(--mundo,var(--primario)) 45%,transparent);border-radius:0}
  .barra::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#10152a calc(10% - 2px) 10%)}
  .barra.blanca::after,.barra.fina::after{background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1.5px),rgba(10,12,24,.9) calc(5% - 1.5px) 5%)}
  .barra.blanca i{background:#fff;box-shadow:none}

  /* ciudades: cielo teñido por el mundo, ventanas que alumbran */
  .ciudad{background:linear-gradient(180deg,color-mix(in srgb,var(--mundo-base,#6C4CF1) 32%,#0a0d1c) 0,#0a0d1c 85%)}
  .ciudad .c-cielo{fill:transparent}
  .ciudad .v{filter:drop-shadow(0 0 2px var(--mundo,#9B85FF))}
  .ciudad.apagada{background:#0c0f1c}
  .continuar .ciudad{height:96px}
  .continuar .tarjeta-in{padding-top:12px}
  .mundo{padding:8px}
  .mundo .ciudad{border-radius:14px}
  .nombre-mundo{font-size:17px;letter-spacing:1.4px}
  .bloqueado{opacity:.92}
  .bloqueado .ciudad{filter:saturate(.2) brightness(.75)}

  /* botones con relieve, sin halo */
  .boton{background:linear-gradient(180deg,color-mix(in srgb,var(--b-color) 88%,#fff) 0,var(--b-color) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 var(--labio) 0 var(--b-labio),0 8px 16px -8px rgba(0,0,0,.8);font-size:17px;letter-spacing:.1px}
  .b-sec{background:var(--sup2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 var(--labio) 0 #0b0f20}
  .chip{background:transparent}
  .chip.on{background:color-mix(in srgb,var(--primario) 22%,transparent);border-color:color-mix(in srgb,var(--primario) 60%,transparent);color:#fff}
  .segmentos{background:#0b0f1f}
  .segmentos .on{background:linear-gradient(180deg,#252e55,#1c2445);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px rgba(0,0,0,.5)}

  .meta{background:radial-gradient(90% 120% at 0 50%,rgba(255,182,39,.10),transparent 60%),linear-gradient(180deg,#131a32,#0f1428)}
  .sello-evento{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd77a,#FFB627 55%,#c98500);color:#2A1A00;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .evento{border-color:rgba(255,182,39,.28)}
  .recompensas-chico{border-color:rgba(255,182,39,.35)}
  .rango{background:radial-gradient(80% 70% at 50% 0,rgba(232,179,77,.16),transparent 70%),linear-gradient(180deg,#131a32,#0f1428)}
  .problema{background:radial-gradient(90% 80% at 50% 0,color-mix(in srgb,var(--mundo) 14%,transparent),transparent 70%),linear-gradient(180deg,#131a32,#0f1428)}
  .teclado a{background:linear-gradient(180deg,#1b2240,#151b34);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 0 #0a0e1e}
  .teclado .t-ok{background:linear-gradient(180deg,#5fe8ab,#3DDC97);color:#05301c;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #1d8a5c}
  .placa{border-width:1.5px}
  .cielo{background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--mundo) 18%,#070a14),#070a14)}
  .est-on circle{filter:drop-shadow(0 0 3px var(--logro))}

  /* pestañas: muelle flotante */
  .tabbar{margin:0 12px 14px;padding:7px 6px;border:1px solid var(--borde);border-radius:22px;background:rgba(14,18,36,.92);box-shadow:0 12px 26px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
  .tabbar a{padding:6px 0;border-radius:15px}
  .tabbar .on{background:color-mix(in srgb,var(--primario) 20%,transparent);color:#d6ccff}
}

  --texto:#f6efe2; --texto2:#b9aed3;
  --f-display:"Pixelify Sans", "Courier New", monospace; --f-texto:"Pixelify Sans", "Courier New", monospace; --f-num:"Pixelify Sans", "Courier New", monospace;

do amable y legible.</p></div><dl><dt>Referencias</dt><dd>Stardew Valley</dd><dt>Paleta</dt><dd>Se adapta (cálida, de día)</dd><dt>Tipografías</dt><dd>Jersey 10 · VT323</dd></dl></template><template id="ficha-portatil"><div><h2>Retro portátil</h2><p>La pantalla de 4 verdes con su matriz de puntos y el marco gris. Bordes dobles, sin curvas.</p></div><dl><dt>Referencias</dt><dd>Game Boy</dd><dt>Paleta</dt><dd>No se mantiene: la pantalla solo tiene 4 tonos</dd><dt>Tipografías</dt><dd>Silkscreen · DotGothic16</dd></dl></template><template id="ficha-academia"><div><h2>Dark academia</h2><p>Cuero oscuro, papel envejecido y filetes de bronce. Botones de lacre y el violeta de Prodigia como tinta mágica.</p></div><dl><dt>Referencias</dt><dd>Academia arcana</dd><dt>Paleta</dt><dd>Se adapta (violeta como tinta, rojo lacre)</dd><dt>Tipografías</dt><dd>IM Fell English SC · Cormorant Garamond</dd></dl></template><template id="ficha-mitologia"><div><h2>Mitología ilustrada</h2><p>Negro profundo, fuego y oro. Esquinas cortadas en diagonal, grecas doradas y títulos tallados en mayúsculas.</p></div><dl><dt>Referencias</dt><dd>Hades</dd><dt>Paleta</dt><dd>Se adapta (fuego y oro; los colores de mundo se quedan)</dd><dt>Tipografías</dt><dd>Cinzel · Alegreya Sans</dd></dl></template><template id="ficha-suizo"><div><h2>Editorial suizo</h2><p>Blanco, negro y un solo color. Bordes de 2 px, sin curvas ni sombras suaves, títulos enormes y la retícula a la vista.</p></div><dl><dt>Referencias</dt><dd>Brutalismo</dd><dt>Paleta</dt><dd>Se reduce: violeta como único color fuerte</dd><dt>Tipografías</dt><dd>Archivo · IBM Plex Mono</dd></dl></template><template id="ficha-papeleria"><div><h2>Papelería japonesa</h2><p>Papel cuadriculado, cinta washi, resaltador y sellos. Colores pastel de los mismos mundos, letra a mano.</p></div><dl><dt>Referencias</dt><dd>Diario de estudio</dd><dt>Paleta</dt><dd>Se adapta (pastel)</dd><dt>Tipografías</dt><dd>Zen Maru Gothic · Klee One</dd></dl></template><template id=     try { localStorage.setItem('prodigia-piel', id); } catch (e) {}
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { ir(b.dataset.ir); }); });
  var inicial = location.hash.slice(1);
  if (!inicial) { try { inicial = localStorage.getItem('prodigia-piel') || ''; } catch (e) {} }
  ir(inicial || 'propia');
})();
</script>
