<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>plantilla-semanal-problema-oscura-story</title>
<meta name="prodigia:plantilla" content="true">
<!--
  PLANTILLA SEMANAL · PROBLEMA EN HISTORIA · VARIANTE NOCTURNA (9:16)
  Ídem `plantilla-semanal-problema-story` con tokens dark REALES.
  Hueco inferior para sticker de ENCUESTA.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#090c14; color:#f4f6fb; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .axis { width:100%; height:100%; padding:72px 64px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .kicker { font-size:22px; font-weight:700; letter-spacing:0.14em; color:#8892b0; }
  .num { padding:10px 20px; border-radius:9999px; background:#12172a; border:1px solid #232b47; font-size:20px; font-weight:700; color:#8892b0; }
  .cuerpo { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:44px; text-align:center; }
  .mundo { display:inline-flex; align-items:center; gap:12px; padding:14px 28px; border-radius:9999px; background:linear-gradient(120deg,#7C5CFF,#FFC53D); color:#fff; font-size:22px; font-weight:700; letter-spacing:0.1em; box-shadow:0 12px 24px -10px rgba(124,92,255,0.5); }
  .problema { font-size:170px; line-height:0.98; font-weight:700; letter-spacing:-0.02em; color:#f4f6fb; }
  .problema em { font-style:normal; color:#7C5CFF; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; width:100%; }
  .op { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:30px 32px; border-radius:28px; background:#12172a; border:1px solid #232b47; text-align:left; }
  .op b { font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace; font-size:28px; font-weight:700; color:#7C5CFF; }
  .op span { font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace; font-size:44px; font-weight:700; color:#f4f6fb; }
  .sticker { margin-top:22px; align-self:stretch; border:2px dashed #2b3352; border-radius:24px; height:190px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#8892b0; letter-spacing:0.06em; }
</style>
</head>
<body>
  <div class="axis">
    <div class="top">
      <span class="kicker mono">PROBLEMA DE LA SEMANA · N°[EDITAR · número]</span>
      <span class="num mono">HISTORIA · NOCTURNO</span>
    </div>
    <div class="cuerpo">
      <span class="mundo mono">[EDITAR · mundo]</span>
      <p class="problema">[EDITAR · problema]<br><em>= ?</em></p>
      <div class="grid">
        <div class="op"><b>A</b><span>[EDITAR]</span></div>
        <div class="op"><b>B</b><span>[EDITAR]</span></div>
        <div class="op"><b>C</b><span>[EDITAR]</span></div>
        <div class="op"><b>D</b><span>[EDITAR]</span></div>
      </div>
    </div>
    <div class="sticker">TU STICKER DE ENCUESTA VA ACÁ</div>
  </div>
</body>
</html>
