<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>plantilla-motivacion-semana-story</title>
<meta name="prodigia:plantilla" content="true">
<!--
  PLANTILLA · MOTIVACIÓN SEMANAL EN HISTORIA (9:16)
  Fondo pleno crema con frase gigante. Hueco inferior para sticker.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#fdfbf7; color:#1f2430; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .axis { width:100%; height:100%; padding:72px 64px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .kicker { font-size:22px; font-weight:700; letter-spacing:0.14em; color:#6b7280; }
  .num { padding:10px 20px; border-radius:9999px; background:#f3efe7; font-size:20px; font-weight:700; color:#6b7280; }
  .cuerpo { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:28px; text-align:center; }
  .frase { font-size:110px; line-height:1.0; font-weight:700; letter-spacing:-0.03em; max-width:1000px; }
  .frase em { font-style:normal; background:linear-gradient(120deg,#6C4CF1,#FFC53D); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .refuerzo { font-size:34px; line-height:1.5; color:#3d3d45; max-width:920px; }
  .sticker { margin-top:22px; align-self:stretch; border:3px dashed #d4cfc4; border-radius:24px; height:150px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#9a7b4f; letter-spacing:0.06em; }
</style>
</head>
<body>
  <div class="axis">
    <div class="top">
      <span class="kicker mono">MOTIVACIÓN · SEMANA [EDITAR · número]</span>
      <span class="num mono">HISTORIA</span>
    </div>
    <div class="cuerpo">
      <h1 class="frase">Entrená tu cabeza<br>como si fuera<em> un músculo.</em></h1>
      <p class="refuerzo">[EDITAR · refuerzo corto real]</p>
    </div>
    <div class="sticker">TU STICKER VA ACÁ</div>
  </div>
</body>
</html>
