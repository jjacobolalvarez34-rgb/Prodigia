<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>pieza-luz-melodia-banner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#fdfbf7; color:#1f2430; }
  .axis { width:100%; height:100%; padding:48px; display:flex; flex-direction:column; justify-content:center; gap:26px; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .row { display:flex; align-items:center; gap:40px; }
  .copy { flex:1.15; display:flex; flex-direction:column; gap:16px; }
  .eyebrow { font-size:17px; font-weight:700; letter-spacing:0.14em; color:#6b7280; }
  .headline { font-size:52px; line-height:1.0; font-weight:700; letter-spacing:-0.02em; }
  .headline em { font-style:normal; background:linear-gradient(120deg,#6C4CF1,#A794FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:20px; line-height:1.35; color:#6b7280; }
  .cta { display:inline-flex; align-items:center; align-self:flex-start; gap:12px; padding:16px 30px; border-radius:9999px; background:linear-gradient(120deg,#6C4CF1,#FFC53D); color:#fff; font-size:20px; font-weight:700; box-shadow:0 16px 32px -12px rgba(108,76,241,0.5); }
  .card { flex:0 0 400px; height:400px; border-radius:28px; overflow:hidden; box-shadow:0 28px 56px -20px rgba(31,36,48,0.35); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:700; color:#9a7b4f; }
</style>
</head>
<body>
  <div class="axis">
    <div class="row">
      <div class="copy">
        <span class="eyebrow mono">PRODIGIA · MELODÍA</span>
        <h1 class="headline">La cabeza también<br><em>tiene oído.</em></h1>
        <p class="sub">Notas, compases y ritmo en el pentagrama. Otro mundo del mismo músculo.</p>
        <span class="cta">Entrenar gratis</span>
      </div>
      <div class="card"><img src="../pantallas-reales/20-melodia-detalle-musical.png" alt="Detalle musical del mundo Melodía"></div>
    </div>
    <div class="foot">
      <span class="mono" style="font-size:16px; color:#6b7280;">cada mundo · una habilidad distinta</span>
      <span class="brand mono">prodigia.app</span>
    </div>
  </div>
</body>
</html>
