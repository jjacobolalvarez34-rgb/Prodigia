<!doctype html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#090c14; color:#f4f6fb; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .axis { width:100%; height:100%; padding:56px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .kicker { font-size:20px; font-weight:700; letter-spacing:0.14em; color:#8892b0; }
  .num { padding:10px 20px; border-radius:9999px; background:#12172a; border:1px solid #232b47; font-size:20px; font-weight:700; color:#8892b0; }
  .cuerpo { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; text-align:center; }
  .tema { display:inline-flex; align-items:center; gap:12px; padding:12px 24px; border-radius:9999px; background:#12172a; border:1px solid #232b47; font-size:20px; font-weight:700; color:#f4f6fb; margin-bottom:16px; }
  .dato { font-size:190px; line-height:0.98; font-weight:700; letter-spacing:-0.03em; background:linear-gradient(120deg,#7C5CFF,#FFC53D); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .titulo { font-size:56px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; max-width:880px; color:#f4f6fb; }
  .regla { margin-top:22px; padding:14px 28px; border-radius:9999px; background:#12172a; border:1px solid #232b47; font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace; font-size:20px; font-weight:700; color:#8892b0; }
  .footer { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .cta { display:inline-flex; align-items:center; gap:12px; padding:18px 34px; border-radius:9999px; background:linear-gradient(120deg,#7C5CFF,#FFC53D); color:#fff; font-size:22px; font-weight:700; box-shadow:0 16px 32px -12px rgba(124,92,255,0.55); }
  .brand { font-size:20px; font-weight:700; color:#8892b0; }
</style>
</head>
<body>
  <div class="axis">
    <div class="top">
      <span class="kicker mono">LO QUE APRENDÉS JUGANDO · N°[EDITAR · número]</span>
      <span class="num mono">NOCTURNO</span>
    </div>
    <div class="cuerpo">
      <span class="tema mono">[EDITAR · tema]</span>

      <h1 class="titulo">[EDITAR · título corto]</h1>

    </div>
    <div class="footer">
      <span class="cta">[EDITAR · cta]</span>
      <span class="brand mono">prodigia.app</span>
    </div>
  </div>
</body>
