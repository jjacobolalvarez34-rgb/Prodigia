<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>plantilla-meme-matematico-square</title>
<meta name="prodigia:plantilla" content="true">
<!--
  PLANTILLA · MEME EDUCATIVO (1:1)
  Formato tipo meme (arriba frase, centro problema, abajo punchline) pero con marca.
  Cambiá el chiste: texto de arriba = situación, centro = problema, abajo = remate.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#fdfbf7; color:#1f2430; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .meme { width:100%; height:100%; padding:56px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; text-align:center; }
  .top-text { font-size:34px; line-height:1.2; font-weight:700; letter-spacing:-0.01em; max-width:900px; text-transform:uppercase; }
  .centro { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px; }
  .problema { font-size:150px; line-height:1; font-weight:700; letter-spacing:-0.02em; }
  .problema em { font-style:normal; color:#6C4CF1; }
  .explicacion { max-width:880px; font-size:28px; line-height:1.4; color:#3d3d45; }
  .bottom-text { font-size:34px; line-height:1.2; font-weight:700; letter-spacing:-0.01em; max-width:900px; text-transform:uppercase; background:linear-gradient(120deg,#6C4CF1,#FFC53D); -webkit-background-clip:text; background-clip:text; color:transparent; }
</style>
</head>
<body>
  <div class="meme">
    <p class="top-text">[EDITAR · reacción / situación en mayúsculas]</p>
    <div class="centro">
      <p class="problema">[EDITAR · problema]<em> = ?</em></p>
      <p class="explicacion">[EDITAR · micro-explicación en una línea]</p>
    </div>
    <p class="bottom-text">[EDITAR · remate / punchline]</p>
  </div>
</body>
</html>
