<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>pieza-luz-8-mundos-square</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#fdfbf7; color:#1f2430; }
  .axis { width:100%; height:100%; padding:56px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .eyebrow { font-size:20px; font-weight:700; letter-spacing:0.14em; color:#6b7280; }
  .top-right { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:700; color:#1f2430; }
  .card { border-radius:28px; overflow:hidden; box-shadow:0 28px 56px -20px rgba(31,36,48,0.35); height:430px; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .headline { margin-top:28px; font-size:46px; line-height:1.02; font-weight:700; letter-spacing:-0.02em; }
  .headline em { font-style:normal; background:linear-gradient(120deg,#6C4CF1,#A794FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:14px; font-size:21px; line-height:1.4; color:#6b7280; max-width:820px; }
  .footer { display:flex; align-items:center; justify-content:space-between; margin-top:30px; }
  .cta { display:inline-flex; align-items:center; gap:12px; padding:18px 34px; border-radius:9999px; background:linear-gradient(120deg,#6C4CF1,#FFC53D); color:#fff; font-size:22px; font-weight:700; box-shadow:0 16px 32px -12px rgba(108,76,241,0.5); }
  .brand { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:700; color:#9a7b4f; }
</style>
</head>
<body>
  <div class="axis">
    <div class="top">
      <span class="eyebrow mono">PRODIGIA · cálculo mental</span>
      <span class="top-right mono">60 s por sprint</span>
    </div>
    <div class="card"><img src="../pantallas-reales/10-home-principal.png" alt="Home de Prodigia con los 8 mundos"></div>
    <h1 class="headline">8 mundos.<br><em>Una sola cabeza.</em> Sin límite.</h1>
    <p class="sub">De las sumas a la música, la geografía y la química. Cada mundo entrena tu cabeza en 60 segundos por sprint.</p>
    <div class="footer">
      <span class="cta">Empezá gratis</span>
      <span class="brand mono">prodigia.app</span>
    </div>
  </div>
</body>
</html>
