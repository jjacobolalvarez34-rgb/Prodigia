<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>pieza-luz-carrusel-adaptativa-2-story</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#fdfbf7; color:#1f2430; }
  .axis { width:100%; height:100%; padding:64px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .eyebrow { font-size:22px; font-weight:700; letter-spacing:0.14em; color:#6b7280; }
  .slide { padding:10px 20px; border-radius:9999px; background:#f3efe7; font-size:22px; font-weight:700; color:#6b7280; }
  .headline { font-size:56px; line-height:1.02; font-weight:700; letter-spacing:-0.02em; }
  .headline em { font-style:normal; background:linear-gradient(120deg,#6C4CF1,#A794FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .escena { position:relative; border-radius:32px; overflow:hidden; box-shadow:0 28px 56px -20px rgba(31,36,48,0.35); height:880px; margin:34px 0; }
  .escena img { width:100%; height:100%; object-fit:cover; display:block; }
  .problema { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; }
  .problema .exp { font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace; font-size:104px; font-weight:700; color:#6C4CF1; text-shadow:0 10px 30px rgba(255,255,255,0.7); }
  .dial { display:inline-flex; align-items:center; gap:12px; margin-top:14px; padding:12px 18px; border-radius:9999px; background:#fff; box-shadow:0 12px 24px -8px rgba(31,36,48,0.25); }
  .pip { width:16px; height:16px; border-radius:9999px; background:#d9d4e8; }
  .pip.on { background:linear-gradient(120deg,#6C4CF1,#FFC53D); }
  .tag { font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace; font-size:24px; font-weight:700; color:#1f2430; margin-left:12px; }
  .sub { margin-top:16px; padding:12px 20px; border-radius:9999px; background:#fff; box-shadow:0 12px 24px -8px rgba(31,36,48,0.25); font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace; font-size:22px; font-weight:700; color:#B8860B; }
  .footer { display:flex; align-items:center; justify-content:space-between; margin-top:22px; }
  .cta { display:inline-flex; align-items:center; gap:12px; padding:18px 34px; border-radius:9999px; background:linear-gradient(120deg,#6C4CF1,#FFC53D); color:#fff; font-size:22px; font-weight:700; box-shadow:0 16px 32px -12px rgba(108,76,241,0.5); }
  .brand { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:700; color:#9a7b4f; }
</style>
</head>
<body>
  <div class="axis">
    <div class="top">
      <span class="eyebrow mono">ASÍ FUNCIONA · LA DIFICULTAD SE ADAPTA</span>
      <span class="slide mono">2 / 3</span>
    </div>
    <h1 class="headline">3 seguidas <em>y subís.</em></h1>
    <div class="escena">
      <img src="../pantallas-reales/23-demo-numeria-sprint.png" alt="Sprint de Numeria">
      <div class="problema">
        <div class="exp">17 + 9</div>
        <div class="dial"><span class="pip on"></span><span class="pip on"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="tag mono">NIVEL 4</span></div>
        <div class="sub">3 SEGUIDAS →</div>
      </div>
    </div>
    <div class="footer">
      <span class="cta">Ver cómo se adapta</span>
      <span class="brand mono">prodigia.app</span>
    </div>
  </div>
</body>
</html>
