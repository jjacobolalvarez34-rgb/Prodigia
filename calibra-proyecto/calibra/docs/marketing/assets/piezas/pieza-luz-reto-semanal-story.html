<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>pieza-luz-reto-semanal-story</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif; background:#fdfbf7; color:#1f2430; }
  .axis { width:100%; height:100%; padding:64px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .mono { font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; font-variant-numeric:tabular-nums; }
  .eyebrow { font-size:24px; font-weight:700; letter-spacing:0.14em; color:#6b7280; }
  .top-right { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:700; color:#1f2430; }
  .card { border-radius:32px; overflow:hidden; box-shadow:0 28px 56px -20px rgba(31,36,48,0.35); height:850px; margin:36px 0; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .headline { margin-top:28px; font-size:64px; line-height:1.0; font-weight:700; letter-spacing:-0.02em; }
  .headline em { font-style:normal; background:linear-gradient(120deg,#6C4CF1,#A794FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:14px; font-size:21px; line-height:1.4; color:#6b7280; max-width:820px; }
  .footer { display:flex; align-items:center; justify-content:space-between; margin-top:30px; }
  .cta { display:inline-flex; align-items:center; gap:12px; padding:20px 38px; border-radius:9999px; background:linear-gradient(120deg,#6C4CF1,#FFC53D); color:#fff; font-size:24px; font-weight:700; box-shadow:0 16px 32px -12px rgba(108,76,241,0.5); }
  .brand { display:flex; align-items:center; gap:12px; font-size:22px; font-weight:700; color:#9a7b4f; }
  .state { display:inline-flex; align-items:center; gap:14px; padding:12px 20px; border-radius:9999px; background:#f3efe7; font-size:22px; color:#3d3d45; align-self:flex-start; }
  .state strong { font-size:26px; color:#1f2430; }
</style>
</head>
<body>
  <div class="axis">
    <div class="top">
      <span class="eyebrow mono">PRODIGIA · RETO SEMANAL</span>
      <span class="top-right mono">45 preguntas</span>
    </div>
    <h1 class="headline">Una semana.<br><em>Tu nombre</em> en el ranking.</h1>
    <div class="card"><img src="../pantallas-reales/32-reto-semanal.png" alt="Captura del reto semanal de Prodigia con ranking público"></div>
    <div class="state"><span>acierto</span><strong>10 Chispas</strong></div>
    <div class="footer">
      <span class="cta">Juega el reto</span>
      <span class="brand mono">prodigia.app</span>
    </div>
  </div>
</body>
</html>
