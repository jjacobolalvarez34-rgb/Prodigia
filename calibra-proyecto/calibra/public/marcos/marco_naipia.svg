<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Marco temático de Naipia (mundo 12) — generado programáticamente
    (anillo + motivo simple: 4 espadas de la baraja estilizadas, una por
    punto cardinal), mismo espíritu que los marcos de Calculia/Circuitia.
    Naipia se plantea como deporte mental de memoria y conteo mental.
    Centro transparente a propósito: se superpone sobre el avatar vía
    AvatarConMarco.tsx, no lo reemplaza.
    TODO: reemplazar por un asset de diseño real cuando esté disponible,
    igual que los otros mundos.
  -->
  <defs>
    <linearGradient id="anilloNaipia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    <path id="espadaNaipia" d="M0 -10 C6 -3 12 0 12 5 A5 5 0 0 1 3 7 C4 10 5 12 7 13 L-7 13 C-5 12 -4 10 -3 7 A5 5 0 0 1 -12 5 C-12 0 -6 -3 0 -10 Z" />
  </defs>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#anilloNaipia)" stroke-width="10" />
  <g fill="#B91C1C">
    <use href="#espadaNaipia" transform="translate(100 15) scale(0.9)" />
    <use href="#espadaNaipia" transform="translate(185 100) rotate(90) scale(0.9)" />
    <use href="#espadaNaipia" transform="translate(100 185) rotate(180) scale(0.9)" />
    <use href="#espadaNaipia" transform="translate(15 100) rotate(270) scale(0.9)" />
  </g>
</svg>
